    <p>මෙම 'පාසල් කාලසටහන' (com.sinhala.kk) යෙදුම මඟින් පරිශීලකයන්ගේ කිසිදු පෞද්ගලික දත්තයක් රැස් කිරීම හෝ තෙවන පාර්ශවයක් සමඟ බෙදා ගැනීම සිදු නොකරයි.</p>
